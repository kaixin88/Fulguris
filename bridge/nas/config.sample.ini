[bridge]
# 你的免费 PHP 空间上 bridge 目录的地址（结尾不带斜杠）
base_url = https://your-php-host.example.com/bridge
# 与 PHP 空间 config.php 里的 BRIDGE_SECRET 相同
secret = CHANGE_ME_TO_A_LONG_RANDOM_STRING

[llm]
# OpenAI 兼容接口（GLM / DeepSeek / 其它自建网关均可）
base_url = https://api.deepseek.com/v1
api_key = sk-xxxx
model = deepseek-chat
